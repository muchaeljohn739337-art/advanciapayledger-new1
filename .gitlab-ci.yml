stages:
  - test
  - build
  - deploy

variables:
  NODE_VERSION: "18"
  CACHE_KEY: "$CI_COMMIT_REF_SLUG"

cache:
  key: ${CACHE_KEY}
  paths:
    - node_modules/

before_script:
  - npm ci --cache .npm --prefer-offline

# Test Stage
test:
  stage: test
  script:
    - npm run lint
    - npm run test
  coverage: '/Lines\s*:\s*(\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - develop

# Build Stage
build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  only:
    - main
    - develop

# Deploy to Staging
deploy_staging:
  stage: deploy
  script:
    - npm install -g wrangler
    - wrangler deploy --env staging
  environment:
    name: staging
    url: https://advancia-payledger-backend-staging.advancia-platform.workers.dev
  dependencies:
    - build
  only:
    - develop

# Deploy to Production
deploy_production:
  stage: deploy
  script:
    - npm install -g wrangler
    - wrangler deploy --env production
  environment:
    name: production
    url: https://advancia-payledger-backend.advancia-platform.workers.dev
  dependencies:
    - build
  when: manual
  only:
    - main

# Security Scanning
security_scan:
  stage: test
  script:
    - npm audit --audit-level moderate
    - npx snyk test
  allow_failure: true
  only:
    - main
    - develop
    - merge_requests

# Performance Testing
performance_test:
  stage: test
  script:
    - npm install -g artillery
    - artillery run performance-test.yml
  artifacts:
    paths:
      - artillery-report.json
    expire_in: 1 week
  only:
    - merge_requests
    - main

# Health Check
health_check:
  stage: deploy
  script:
    - curl -f https://advancia-payledger-backend.advancia-platform.workers.dev/api/health || exit 1
  dependencies:
    - deploy_production
  only:
    - main
