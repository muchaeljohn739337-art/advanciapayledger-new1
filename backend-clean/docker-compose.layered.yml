version: '3.8'

# Rockefeller HELOC Layered Network Architecture
# Reference Number: 123456789-HELOC
# Three-Layer Architecture: Structural → Information → Control

# Layer-specific networks with isolation
networks:
  # Structural Layer Network - Infrastructure Only
  structural-network:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/16
          gateway: 172.21.0.1
    labels:
      layer: "structural"
      purpose: "infrastructure-management"
      data-classification: "infrastructure-only"

  # Information Layer Network - Data Processing Only
  information-network:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.22.0.0/16
          gateway: 172.22.0.1
    labels:
      layer: "information"
      purpose: "data-processing"
      data-classification: "business-data"

  # Control Layer Network - User Interface & Business Logic
  control-network:
    driver: bridge
    internal: false
    ipam:
      config:
        - subnet: 172.23.0.0/16
          gateway: 172.23.0.1
    labels:
      layer: "control"
      purpose: "business-logic"
      data-classification: "user-data"

  # Cross-layer communication network (restricted)
  gateway-network:
    driver: bridge
    internal: false
    ipam:
      config:
        - subnet: 172.24.0.0/16
          gateway: 172.24.0.1
    labels:
      layer: "gateway"
      purpose: "inter-layer-communication"
      data-classification: "controlled"

services:
  # ==========================================
  # STRUCTURAL LAYER SERVICES
  # ==========================================

  # Infrastructure Manager - Resource Allocation & Management
  infrastructure-manager:
    build: 
      context: .
      dockerfile: Dockerfile.structural
    networks:
      - structural-network
    environment:
      - LAYER=STRUCTURAL
      - SERVICE_TYPE=INFRASTRUCTURE_MANAGER
      - AUTHORITY_LEVEL=INFRASTRUCTURE_ADMIN
      - DATA_ACCESS=INFRASTRUCTURE_ONLY
      - COMMUNICATION_ALLOWED=UPWARD_ONLY
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      layer: "structural"
      service: "infrastructure-manager"
      authority: "infrastructure"

  # Security Manager - Certificate & Access Management
  security-manager:
    build: 
      context: .
      dockerfile: Dockerfile.structural
    networks:
      - structural-network
    environment:
      - LAYER=STRUCTURAL
      - SERVICE_TYPE=SECURITY_MANAGER
      - AUTHORITY_LEVEL=SECURITY_ADMIN
      - DATA_ACCESS=SECURITY_ONLY
      - COMMUNICATION_ALLOWED=UPWARD_ONLY
    volumes:
      - ./ssl:/etc/ssl/certs:ro
      - ./keys:/etc/ssl/private:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      layer: "structural"
      service: "security-manager"
      authority: "security"

  # Storage Manager - Database & Cache Management
  storage-manager:
    build: 
      context: .
      dockerfile: Dockerfile.structural
    networks:
      - structural-network
    environment:
      - LAYER=STRUCTURAL
      - SERVICE_TYPE=STORAGE_MANAGER
      - AUTHORITY_LEVEL=STORAGE_ADMIN
      - DATA_ACCESS=STORAGE_ONLY
      - COMMUNICATION_ALLOWED=UPWARD_ONLY
    depends_on:
      - postgres-structural
      - redis-structural
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      layer: "structural"
      service: "storage-manager"
      authority: "storage"

  # Network Manager - Network Configuration & Routing
  network-manager:
    build: 
      context: .
      dockerfile: Dockerfile.structural
    networks:
      - structural-network
      - gateway-network
    environment:
      - LAYER=STRUCTURAL
      - SERVICE_TYPE=NETWORK_MANAGER
      - AUTHORITY_LEVEL=NETWORK_ADMIN
      - DATA_ACCESS=NETWORK_ONLY
      - COMMUNICATION_ALLOWED=CONTROLLED
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      layer: "structural"
      service: "network-manager"
      authority: "network"

  # Structural Layer Databases
  postgres-structural:
    image: postgres:15-alpine
    networks:
      - structural-network
    environment:
      - POSTGRES_DB=structural_layer
      - POSTGRES_USER=structural_admin
      - POSTGRES_PASSWORD=${STRUCTURAL_DB_PASSWORD}
    volumes:
      - structural_postgres_data:/var/lib/postgresql/data
      - ./scripts/init-structural-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U structural_admin"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      layer: "structural"
      service: "database"
      data-classification: "infrastructure"

  redis-structural:
    image: redis:7-alpine
    networks:
      - structural-network
    volumes:
      - structural_redis_data:/data
      - ./redis/structural.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      layer: "structural"
      service: "cache"
      data-classification: "infrastructure"

  # ==========================================
  # INFORMATION LAYER SERVICES
  # ==========================================

  # Data Ingestion Service - API Gateway & Data Collection
  data-ingestion:
    build: 
      context: .
      dockerfile: Dockerfile.information
    networks:
      - structural-network
      - information-network
      - gateway-network
    environment:
      - LAYER=INFORMATION
      - SERVICE_TYPE=DATA_INGESTION
      - AUTHORITY_LEVEL=DATA_PROCESSOR
      - DATA_ACCESS=VALIDATED_DATA_ONLY
      - COMMUNICATION_ALLOWED=CONTROLLED
      - STRUCTURAL_ACCESS=READ_ONLY
    depends_on:
      - storage-manager
      - validation-engine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9101/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      layer: "information"
      service: "data-ingestion"
      authority: "data-processing"

  # Validation Engine - Data Validation & Security
  validation-engine:
    build: 
      context: .
      dockerfile: Dockerfile.information
    networks:
      - information-network
    environment:
      - LAYER=INFORMATION
      - SERVICE_TYPE=VALIDATION_ENGINE
      - AUTHORITY_LEVEL=DATA_VALIDATOR
      - DATA_ACCESS=VALIDATION_ONLY
      - COMMUNICATION_ALLOWED=LAYER_INTERNAL
    depends_on:
      - postgres-information
      - redis-information
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9102/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      layer: "information"
      service: "validation-engine"
      authority: "validation"

  # Processing Engine - Business Logic & Data Transformation
  processing-engine:
    build: 
      context: .
      dockerfile: Dockerfile.information
    networks:
      - information-network
      - gateway-network
    environment:
      - LAYER=INFORMATION
      - SERVICE_TYPE=PROCESSING_ENGINE
      - AUTHORITY_LEVEL=DATA_PROCESSOR
      - DATA_ACCESS=PROCESSED_DATA_ONLY
      - COMMUNICATION_ALLOWED=CONTROLLED
    depends_on:
      - validation-engine
      - analytics-engine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9103/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      layer: "information"
      service: "processing-engine"
      authority: "processing"

  # Analytics Engine - Metrics & Reporting
  analytics-engine:
    build: 
      context: .
      dockerfile: Dockerfile.information
    networks:
      - information-network
    environment:
      - LAYER=INFORMATION
      - SERVICE_TYPE=ANALYTICS_ENGINE
      - AUTHORITY_LEVEL=ANALYTICS_PROCESSOR
      - DATA_ACCESS=ANALYTICS_ONLY
      - COMMUNICATION_ALLOWED=LAYER_INTERNAL
    depends_on:
      - postgres-information
      - redis-information
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9104/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      layer: "information"
      service: "analytics-engine"
      authority: "analytics"

  # Information Layer Databases
  postgres-information:
    image: postgres:15-alpine
    networks:
      - information-network
    environment:
      - POSTGRES_DB=information_layer
      - POSTGRES_USER=information_admin
      - POSTGRES_PASSWORD=${INFORMATION_DB_PASSWORD}
    volumes:
      - information_postgres_data:/var/lib/postgresql/data
      - ./scripts/init-information-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U information_admin"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      layer: "information"
      service: "database"
      data-classification: "business-data"

  redis-information:
    image: redis:7-alpine
    networks:
      - information-network
    volumes:
      - information_redis_data:/data
      - ./redis/information.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      layer: "information"
      service: "cache"
      data-classification: "business-data"

  # ==========================================
  # CONTROL LAYER SERVICES
  # ==========================================

  # Business Logic Service - HELOC Core Logic
  business-logic:
    build: 
      context: .
      dockerfile: Dockerfile.control
    networks:
      - information-network
      - control-network
      - gateway-network
    environment:
      - LAYER=CONTROL
      - SERVICE_TYPE=BUSINESS_LOGIC
      - AUTHORITY_LEVEL=BUSINESS_EXECUTOR
      - DATA_ACCESS=BUSINESS_DATA_ONLY
      - COMMUNICATION_ALLOWED=CONTROLLED
      - INFORMATION_ACCESS=READ_ONLY
    depends_on:
      - processing-engine
      - user-interface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9201/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      layer: "control"
      service: "business-logic"
      authority: "business"

  # User Interface Service - Frontend & API
  user-interface:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.control
    networks:
      - control-network
    ports:
      - "3000:3000"
    environment:
      - LAYER=CONTROL
      - SERVICE_TYPE=USER_INTERFACE
      - AUTHORITY_LEVEL=USER_ACCESS
      - DATA_ACCESS=USER_DATA_ONLY
      - COMMUNICATION_ALLOWED=EXTERNAL
      - REACT_APP_API_URL=http://localhost:4000
    depends_on:
      - business-logic
      - execution-engine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      layer: "control"
      service: "user-interface"
      authority: "user"

  # Execution Engine - Workflow & State Management
  execution-engine:
    build: 
      context: .
      dockerfile: Dockerfile.control
    networks:
      - control-network
    environment:
      - LAYER=CONTROL
      - SERVICE_TYPE=EXECUTION_ENGINE
      - AUTHORITY_LEVEL=WORKFLOW_EXECUTOR
      - DATA_ACCESS=EXECUTION_DATA_ONLY
      - COMMUNICATION_ALLOWED=LAYER_INTERNAL
    depends_on:
      - postgres-control
      - redis-control
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9203/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      layer: "control"
      service: "execution-engine"
      authority: "execution"

  # Decision Engine - AI & Rule Engine
  decision-engine:
    build: 
      context: .
      dockerfile: Dockerfile.control
    networks:
      - control-network
      - gateway-network
    environment:
      - LAYER=CONTROL
      - SERVICE_TYPE=DECISION_ENGINE
      - AUTHORITY_LEVEL=DECISION_MAKER
      - DATA_ACCESS=DECISION_DATA_ONLY
      - COMMUNICATION_ALLOWED=CONTROLLED
      - AI_PROVIDERS_ENABLED=true
    depends_on:
      - postgres-control
      - redis-control
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9204/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      layer: "control"
      service: "decision-engine"
      authority: "decision"

  # Control Layer Databases
  postgres-control:
    image: postgres:15-alpine
    networks:
      - control-network
    environment:
      - POSTGRES_DB=control_layer
      - POSTGRES_USER=control_admin
      - POSTGRES_PASSWORD=${CONTROL_DB_PASSWORD}
    volumes:
      - control_postgres_data:/var/lib/postgresql/data
      - ./scripts/init-control-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control_admin"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      layer: "control"
      service: "database"
      data-classification: "user-data"

  redis-control:
    image: redis:7-alpine
    networks:
      - control-network
    volumes:
      - control_redis_data:/data
      - ./redis/control.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      layer: "control"
      service: "cache"
      data-classification: "user-data"

  # ==========================================
  # GATEWAY SERVICES (Inter-Layer Communication)
  # ==========================================

  # Structural-Information Gateway
  structural-information-gateway:
    build: 
      context: .
      dockerfile: Dockerfile.gateway
    networks:
      - structural-network
      - information-network
      - gateway-network
    environment:
      - LAYER=GATEWAY
      - SERVICE_TYPE=STRUCTURAL_INFORMATION_GATEWAY
      - AUTHORITY_LEVEL=GATEWAY_OPERATOR
      - DATA_ACCESS=VALIDATED_INFRASTRUCTURE_DATA
      - COMMUNICATION_ALLOWED=CONTROLLED
      - FLOW_DIRECTION=BIDIRECTIONAL_CONTROLLED
      - ALLOWED_OPERATIONS=resource_status,performance_metrics,security_events
    depends_on:
      - infrastructure-manager
      - data-ingestion
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9301/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      layer: "gateway"
      service: "structural-information-gateway"
      authority: "gateway"

  # Information-Control Gateway
  information-control-gateway:
    build: 
      context: .
      dockerfile: Dockerfile.gateway
    networks:
      - information-network
      - control-network
      - gateway-network
    environment:
      - LAYER=GATEWAY
      - SERVICE_TYPE=INFORMATION_CONTROL_GATEWAY
      - AUTHORITY_LEVEL=GATEWAY_OPERATOR
      - DATA_ACCESS=VALIDATED_BUSINESS_DATA
      - COMMUNICATION_ALLOWED=CONTROLLED
      - FLOW_DIRECTION=BIDIRECTIONAL_CONTROLLED
      - ALLOWED_OPERATIONS=validated_data,processed_information,analytics_results
    depends_on:
      - processing-engine
      - business-logic
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9302/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      layer: "gateway"
      service: "information-control-gateway"
      authority: "gateway"

  # Control-Structural Gateway (Management Interface)
  control-structural-gateway:
    build: 
      context: .
      dockerfile: Dockerfile.gateway
    networks:
      - control-network
      - structural-network
      - gateway-network
    environment:
      - LAYER=GATEWAY
      - SERVICE_TYPE=CONTROL_STRUCTURAL_GATEWAY
      - AUTHORITY_LEVEL=MANAGEMENT_GATEWAY
      - DATA_ACCESS=MANAGEMENT_COMMANDS_ONLY
      - COMMUNICATION_ALLOWED=CONTROLLED
      - FLOW_DIRECTION=DOWNWARD_ONLY
      - ALLOWED_OPERATIONS=resource_allocation,scaling_requests,security_requirements
    depends_on:
      - business-logic
      - infrastructure-manager
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9303/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      layer: "gateway"
      service: "control-structural-gateway"
      authority: "management"

  # ==========================================
  # MONITORING & OBSERVABILITY
  # ==========================================

  # Layer-specific monitoring
  structural-monitoring:
    image: prom/prometheus:latest
    networks:
      - structural-network
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/structural-prometheus.yml:/etc/prometheus/prometheus.yml
      - structural_prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    labels:
      layer: "structural"
      service: "monitoring"

  information-monitoring:
    image: prom/prometheus:latest
    networks:
      - information-network
    ports:
      - "9092:9090"
    volumes:
      - ./monitoring/information-prometheus.yml:/etc/prometheus/prometheus.yml
      - information_prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    labels:
      layer: "information"
      service: "monitoring"

  control-monitoring:
    image: prom/prometheus:latest
    networks:
      - control-network
    ports:
      - "9093:9090"
    volumes:
      - ./monitoring/control-prometheus.yml:/etc/prometheus/prometheus.yml
      - control_prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    labels:
      layer: "control"
      service: "monitoring"

# ==========================================
# VOLUMES (Layer-specific isolation)
# ==========================================
volumes:
  # Structural Layer Volumes
  structural_postgres_data:
    driver: local
  structural_redis_data:
    driver: local
  structural_prometheus_data:
    driver: local

  # Information Layer Volumes
  information_postgres_data:
    driver: local
  information_redis_data:
    driver: local
  information_prometheus_data:
    driver: local

  # Control Layer Volumes
  control_postgres_data:
    driver: local
  control_redis_data:
    driver: local
  control_prometheus_data:
    driver: local
