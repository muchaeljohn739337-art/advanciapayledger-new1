services:
  - type: web
    name: advancia-backend
    env: node
    region: oregon
    plan: starter
    buildCommand: cd backend-clean && npm install && npx prisma generate && npm run build
    startCommand: cd backend-clean && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: advancia-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: advancia-db
    plan: starter
    databaseName: advancia_payledger
    user: advancia
