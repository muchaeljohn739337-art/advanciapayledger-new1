name: CI / CD — Advancia Pay Ledger

on:
  push:
    branches: [master, main]
  # Manual run options:
  # - deploy_target: both | backend | frontend
  # - deploy_environment: production | staging
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Which app(s) to deploy
        required: true
        default: both
        type: choice
        options:
          - both
          - backend
          - frontend
      deploy_environment:
        description: Deployment environment
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

# Cancel in-progress runs on the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────
  # 1. Backend — type-check + tests
  #    For manual runs, this job executes for both/backend targets.
  #    Use tsc for static type-checking. Tests are fully mocked
  #    (no DB needed).
  # ──────────────────────────────────────────────────────────────
  test-backend:
    name: Backend — type-check & test
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.deploy_target == 'both' ||
      github.event.inputs.deploy_target == 'backend'

    env:
      NODE_ENV: test
      # Required by validate-env.ts even in mocked tests
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_db
      JWT_SECRET: ci-jwt-secret-minimum-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-minimum-32-chars
      STRIPE_SECRET_KEY: sk_test_placeholder
      NOWPAYMENTS_API_KEY: placeholder
      BACKEND_URL: http://localhost:4000
      FRONTEND_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend-clean/package-lock.json

      - name: Install dependencies
        working-directory: backend-clean
        run: npm ci

      - name: Type-check (tsc --noEmit)
        working-directory: backend-clean
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: backend-clean
        run: npm test

  # ──────────────────────────────────────────────────────────────
  # 2. Frontend — install + build
  #    For manual runs, this job executes for both/frontend targets.
  #    vercel.json uses --legacy-peer-deps; mirror that here.
  # ──────────────────────────────────────────────────────────────
  build-frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.deploy_target == 'both' ||
      github.event.inputs.deploy_target == 'frontend'

    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:4000' }}
      NEXT_PUBLIC_SOCKET_URL: ${{ secrets.NEXT_PUBLIC_SOCKET_URL || 'http://localhost:4000' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-clean/package-lock.json

      - name: Install dependencies
        working-directory: frontend-clean
        run: npm ci --legacy-peer-deps

      - name: Build
        working-directory: frontend-clean
        run: npm run build

  # ──────────────────────────────────────────────────────────────
  # 3. Deploy Backend → Hostinger VPS via SSH
  #    Requires secrets: SERVER_HOST, SERVER_USER, SSH_PRIVATE_KEY
  #    Optional secret: SERVER_PORT (default 22)
  #    VPS layout: /var/www/advancia/backend  (git clone of this repo)
  # ──────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → VPS
    needs: [test-backend]
    runs-on: ubuntu-latest
    if: |
      (
        github.ref == 'refs/heads/main' &&
        github.event_name == 'push'
      ) || (
        github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.deploy_target == 'both' || github.event.inputs.deploy_target == 'backend')
      )

    steps:
      - uses: actions/checkout@v4

      - name: Check backend deploy secrets
        id: backend-secrets
        run: |
          if [ -z "${{ secrets.SERVER_HOST }}" ] || [ -z "${{ secrets.SERVER_USER }}" ] || [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "Backend deploy secrets missing; skipping deployment steps."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH
        if: steps.backend-secrets.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd /var/www/advancia/backend

            DEPLOY_ENV="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_environment || 'production' }}"
            APP_NAME="advancia-backend"
            if [ "$DEPLOY_ENV" = "staging" ]; then
              APP_NAME="advancia-backend-staging"
            fi

            # Pull latest code
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}

            # Enter backend package (monorepo layout)
            cd backend-clean

            # Install deps (includes TypeScript compiler for build)
            npm ci

            # Build TypeScript → dist/
            npm run build

            # Run any pending DB migrations (no interaction)
            npx prisma migrate deploy

            # Reload with PM2 (zero-downtime), or start fresh if not running
            pm2 reload "$APP_NAME" --update-env 2>/dev/null \
              || pm2 start dist/index.js --name "$APP_NAME" \
                   --env "$DEPLOY_ENV" \
                   --max-memory-restart 500M \
                   --instances 1 \
                   --exp-backoff-restart-delay 100

            pm2 save

  # ──────────────────────────────────────────────────────────────
  # 4. Deploy Frontend → Vercel (using official Vercel CLI)
  #    Requires secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
  # ──────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    needs: [build-frontend]
    runs-on: ubuntu-latest
    if: |
      (
        github.ref == 'refs/heads/main' &&
        github.event_name == 'push'
      ) || (
        github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.deploy_target == 'both' || github.event.inputs.deploy_target == 'frontend')
      )

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_TELEMETRY_DISABLED: '1'
      VERCEL_DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_environment || 'production' }}
      VERCEL_PULL_ENV: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_environment == 'staging' && 'preview' || 'production' }}

    steps:
      - uses: actions/checkout@v4

      - name: Check frontend deploy secrets
        id: frontend-secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "Vercel deploy secrets missing; skipping deployment steps."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js 20
        if: steps.frontend-secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        if: steps.frontend-secrets.outputs.ready == 'true'
        run: npm install -g vercel@latest

      - name: Pull Vercel environment info
        if: steps.frontend-secrets.outputs.ready == 'true'
        working-directory: frontend-clean
        run: vercel pull --yes --environment=${{ env.VERCEL_PULL_ENV }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifact
        if: steps.frontend-secrets.outputs.ready == 'true'
        working-directory: frontend-clean
        run: |
          if [ "${{ env.VERCEL_DEPLOY_ENV }}" = "production" ]; then
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel build --token=${{ secrets.VERCEL_TOKEN }}
          fi

      - name: Deploy to Vercel
        if: steps.frontend-secrets.outputs.ready == 'true'
        working-directory: frontend-clean
        run: |
          if [ "${{ env.VERCEL_DEPLOY_ENV }}" = "production" ]; then
            vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
          fi


