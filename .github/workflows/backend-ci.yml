name: Backend CI

on:
  pull_request:
    branches: [master, main]
    paths:
      - 'backend-clean/**'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/deploy.yml'
  push:
    branches: [master, main]
    paths:
      - 'backend-clean/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-backend:
    name: Backend — type-check, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_db
      JWT_SECRET: ci-jwt-secret-minimum-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-minimum-32-chars
      STRIPE_SECRET_KEY: sk_test_placeholder
      NOWPAYMENTS_API_KEY: placeholder
      BACKEND_URL: http://localhost:4000
      FRONTEND_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend-clean/package-lock.json

      - name: Install dependencies
        working-directory: backend-clean
        run: npm ci

      - name: Type-check (tsc --noEmit)
        working-directory: backend-clean
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: backend-clean
        run: npm test

      - name: Build
        working-directory: backend-clean
        run: npm run build