name: Frontend CI

on:
  pull_request:
    branches: [master, main]
    paths:
      - 'frontend-clean/**'
      - '.github/workflows/frontend-ci.yml'
      - '.github/workflows/deploy.yml'
  push:
    branches: [master, main]
    paths:
      - 'frontend-clean/**'
      - '.github/workflows/frontend-ci.yml'

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-frontend:
    name: Frontend — test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:4000' }}
      NEXT_PUBLIC_SOCKET_URL: ${{ secrets.NEXT_PUBLIC_SOCKET_URL || 'http://localhost:4000' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-clean/package-lock.json

      - name: Install dependencies
        working-directory: frontend-clean
        run: npm ci --legacy-peer-deps

      - name: Run tests
        working-directory: frontend-clean
        run: npm test

      - name: Build
        working-directory: frontend-clean
        run: npm run build